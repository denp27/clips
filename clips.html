<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dani Clips — Заработок</title>
<link rel="stylesheet" href="/assets/css/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="container">
  <div class="balance-hero">
    <div class="icon">💲</div>
    <div class="amount" id="balanceAmount">0 ₽</div>
    <a href="#" onclick="showToast('Заработок начисляется после проверки видео админом')">Подробнее ›</a>
  </div>

  <button class="btn btn-primary" onclick="openWithdrawModal()">💳 Вывести</button>

  <div class="section-title">История выводов</div>
  <div id="withdrawHistory"><div class="muted">Загрузка...</div></div>
</div>

<div id="modalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;">
  <div style="position:absolute;bottom:0;left:0;right:0;background:#1b1d22;border-radius:20px 20px 0 0;padding:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div style="font-size:20px;font-weight:700;">Вывод средств</div>
      <span style="cursor:pointer;font-size:20px;" onclick="closeWithdrawModal()">✕</span>
    </div>
    <label>Сумма (₽)</label>
    <input id="withdrawAmount" type="number" placeholder="Введите сумму" />
    <div class="muted" id="availableAmount">Доступно: 0 ₽</div>
    <button class="btn btn-accent" style="margin-top:14px;" onclick="submitWithdraw()">Вывести ›</button>
  </div>
</div>

<script src="/assets/js/app.js"></script>
<script>
let currentBalance = 0;

function statusLabel(status) {
  return { pending: "На рассмотрении", approved: "Одобрено", rejected: "Отклонено" }[status] || status;
}
function statusClass(status) {
  return { pending: "status-pending", approved: "status-accepted", rejected: "status-rejected" }[status] || "status-pending";
}

async function loadBalance() {
  const me = await api("/api/me");
  currentBalance = me.balance;
  document.getElementById("balanceAmount").textContent = `${me.balance.toFixed(2)} ₽`;
  document.getElementById("availableAmount").textContent = `Доступно: ${me.balance.toFixed(2)} ₽`;
}

async function loadHistory() {
  const list = await api("/api/withdrawals");
  const box = document.getElementById("withdrawHistory");
  if (!list.length) {
    box.innerHTML = `<div class="empty-state">
      Заявок на вывод пока нет<br/>
      <span class="muted">После создания заявки она появится здесь со статусом.</span>
    </div>`;
    return;
  }
  box.innerHTML = list.map(w => `
    <div class="card offer-row">
      <div>
        <div class="title">${w.amount.toFixed(2)} ₽</div>
        <div class="muted">${new Date(w.created_at * 1000).toLocaleString("ru-RU")}</div>
      </div>
      <span class="status-pill ${statusClass(w.status)}">${statusLabel(w.status)}</span>
    </div>
  `).join("");
}

function openWithdrawModal() {
  document.getElementById("modalOverlay").style.display = "block";
}
function closeWithdrawModal() {
  document.getElementById("modalOverlay").style.display = "none";
}

async function submitWithdraw() {
  const amount = parseFloat(document.getElementById("withdrawAmount").value);
  if (!amount || amount <= 0) { showToast("Введите корректную сумму"); return; }
  if (amount > currentBalance) { showToast("Недостаточно средств"); return; }
  try {
    const res = await api("/api/withdraw", { method: "POST", body: JSON.stringify({ amount }) });
    closeWithdrawModal();
    showToast(res.message || "Заявка отправлена");
    document.getElementById("withdrawAmount").value = "";
    await loadHistory();
  } catch (e) {
    showToast("Ошибка: " + e.message);
  }
}

(async () => {
  await maybeShowAdminLink();
  await loadBalance();
  await loadHistory();
})();

renderBottomNav("earnings");
</script>
</body>
</html>
