<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dani Clips — Админ</title>
<link rel="stylesheet" href="/assets/css/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="container">
  <h1 class="page-title">Админ-панель</h1>

  <div class="tabs" id="adminTabs">
    <button data-tab="offers" class="active">Офферы</button>
    <button data-tab="submissions">Видео</button>
    <button data-tab="withdrawals">Выводы</button>
  </div>

  <!-- OFFERS TAB -->
  <div id="tab-offers">
    <div class="card">
      <div class="section-title" style="margin-top:0;">Новый оффер</div>

      <label>Обложка (рекомендуемый размер 1920×1080)</label>
      <input id="newImageFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewImage(event)" />
      <img id="imagePreview" class="upload-preview" />

      <label>Категория</label>
      <select id="newCategory">
        <option value="streamers">Стримеры</option>
        <option value="youtubers">Ютуберы</option>
        <option value="brands">Бренды</option>
      </select>
      <label>Название оффера</label>
      <input id="newTitle" placeholder="Например: Клипы канала XYZ" />
      <label>Канал / аккаунт</label>
      <input id="newChannel" placeholder="@channel или ссылка" />

      <label>Цена за 1000 просмотров (₽)</label>
      <input id="newPrice" type="number" placeholder="Например: 50" />
      <label>От скольки просмотров идёт выплата</label>
      <input id="newMinViews" type="number" placeholder="Например: 1000" />
      <label>Общий бюджет оффера (₽, для полоски прогресса)</label>
      <input id="newBudgetTotal" type="number" placeholder="Например: 586847" />

      <label>Код для хэштега (необязательно)</label>
      <input id="newHashtag" placeholder="Например: DANI123" />

      <label>Детали задания</label>
      <textarea id="newDetails" rows="8" placeholder="Создавайте ролики про @channel, где описываете сильные стороны продукта...&#10;&#10;На что обратить внимание:&#10;• Нельзя накручивать видео&#10;• Нельзя портить репутацию проекта&#10;• Запрещено закрывать комментарии"></textarea>

      <label>Короткое описание для карточки (необязательно)</label>
      <textarea id="newDescription" rows="2" placeholder="Коротко, что видно сразу на карточке..."></textarea>

      <button class="btn btn-accent" onclick="createOffer()">Добавить оффер</button>
    </div>

    <div class="section-title">Все офферы</div>
    <div id="offersAdminList"><div class="muted">Загрузка...</div></div>
  </div>

  <!-- SUBMISSIONS TAB -->
  <div id="tab-submissions" style="display:none;">
    <div id="submissionsAdminList"><div class="muted">Загрузка...</div></div>
  </div>

  <!-- WITHDRAWALS TAB -->
  <div id="tab-withdrawals" style="display:none;">
    <div id="withdrawalsAdminList"><div class="muted">Загрузка...</div></div>
  </div>
</div>

<script src="/assets/js/app.js"></script>
<script>
const CAT_LABEL = { streamers: "Стримеры", youtubers: "Ютуберы", brands: "Бренды" };

document.querySelectorAll("#adminTabs button").forEach(btn => {
  btn.addEventListener("click", () => switchTab(btn.dataset.tab));
});

function switchTab(tab) {
  document.querySelectorAll("#adminTabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  ["offers", "submissions", "withdrawals"].forEach(t => {
    document.getElementById(`tab-${t}`).style.display = t === tab ? "block" : "none";
  });
  if (tab === "offers") loadOffersAdmin();
  if (tab === "submissions") loadSubmissionsAdmin();
  if (tab === "withdrawals") loadWithdrawalsAdmin();
}

function previewImage(event) {
  const file = event.target.files[0];
  const img = document.getElementById("imagePreview");
  if (!file) { img.style.display = "none"; return; }
  img.src = URL.createObjectURL(file);
  img.style.display = "block";
}

async function uploadCoverImage() {
  const fileInput = document.getElementById("newImageFile");
  const file = fileInput.files[0];
  if (!file) return "";
  const formData = new FormData();
  formData.append("file", file);
  const res = await fetch("/api/admin/upload", {
    method: "POST",
    headers: { "X-Init-Data": INIT_DATA },
    body: formData,
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || "не удалось загрузить обложку");
  }
  const data = await res.json();
  return data.url;
}

async function createOffer() {
  const title = document.getElementById("newTitle").value.trim();
  const channel = document.getElementById("newChannel").value.trim();
  const price = parseFloat(document.getElementById("newPrice").value || "0");
  if (!title || !channel || !price) {
    showToast("Заполните название, канал и цену");
    return;
  }
  try {
    showToast("Загружаем обложку...");
    const image_url = await uploadCoverImage();
    const payload = {
      category: document.getElementById("newCategory").value,
      title,
      channel,
      price,
      min_views: parseInt(document.getElementById("newMinViews").value || "0"),
      budget_total: parseFloat(document.getElementById("newBudgetTotal").value || "0"),
      image_url,
      hashtag_code: document.getElementById("newHashtag").value.trim(),
      details: document.getElementById("newDetails").value.trim(),
      description: document.getElementById("newDescription").value.trim(),
    };
    await api("/api/admin/offers", { method: "POST", body: JSON.stringify(payload) });
    showToast("Оффер добавлен");
    ["newTitle", "newChannel", "newPrice", "newMinViews", "newBudgetTotal", "newHashtag", "newDetails", "newDescription"]
      .forEach(id => document.getElementById(id).value = "");
    document.getElementById("newImageFile").value = "";
    document.getElementById("imagePreview").style.display = "none";
    await loadOffersAdmin();
  } catch (e) {
    showToast("Ошибка: " + e.message);
  }
}

async function loadOffersAdmin() {
  const offers = await api("/api/admin/offers");
  const box = document.getElementById("offersAdminList");
  if (!offers.length) { box.innerHTML = `<div class="empty-state">Офферов пока нет</div>`; return; }
  box.innerHTML = offers.map(o => {
    const pct = o.budget_total > 0 ? Math.min(100, Math.round((o.budget_paid / o.budget_total) * 100)) : 0;
    return `
    <div class="card">
      ${o.image_url ? `<img class="offer-cover" src="${o.image_url}" />` : ""}
      <div class="offer-row">
        <div>
          <div class="title">${o.title} <span class="muted">(${CAT_LABEL[o.category] || o.category})</span></div>
          <div class="channel">${o.channel}</div>
        </div>
        <div class="price-tag">${o.price} ₽ / 1000</div>
      </div>
      <div class="offer-meta-row">
        <span class="meta-chip">👁 от ${o.min_views || 0} просмотров</span>
      </div>
      ${o.budget_total > 0 ? `
        <div class="progress-row">
          <span>${o.budget_paid.toFixed(0)} ₽ из ${o.budget_total.toFixed(0)} ₽</span>
          <span class="percent">${pct}%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
      ` : ""}
      <div class="muted" style="margin-top:6px;">${o.active ? "🟢 Активен" : "⚪️ Выключен"}</div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn btn-outline" onclick="toggleOffer(${o.id})">${o.active ? "Выключить" : "Включить"}</button>
        <button class="btn btn-outline" onclick="deleteOffer(${o.id})">Удалить</button>
      </div>
    </div>
  `;
  }).join("");
}

async function toggleOffer(id) {
  await api(`/api/admin/offers/${id}/toggle`, { method: "POST" });
  await loadOffersAdmin();
}
async function deleteOffer(id) {
  if (!confirm("Удалить оффер?")) return;
  await api(`/api/admin/offers/${id}`, { method: "DELETE" });
  await loadOffersAdmin();
}

async function loadSubmissionsAdmin() {
  const subs = await api("/api/admin/submissions");
  const box = document.getElementById("submissionsAdminList");
  if (!subs.length) { box.innerHTML = `<div class="empty-state">Пока нет отправленных видео</div>`; return; }
  box.innerHTML = subs.map(s => `
    <div class="card">
      <div class="title">${s.offer_title}</div>
      <div class="muted">Пользователь: ${s.username ? "@" + s.username : s.user_tg_id}</div>
      <div class="muted" style="word-break:break-all;margin:6px 0;">${s.video_url}</div>
      <span class="status-pill ${s.status === "accepted" ? "status-accepted" : s.status === "rejected" ? "status-rejected" : "status-pending"}">${s.status}</span>
      <div style="margin-top:10px;">
        <label>Просмотры</label>
        <input type="number" id="views-${s.id}" value="${s.views}" />
        <div style="display:flex;gap:8px;">
          <button class="btn btn-accent" onclick="updateSubmission(${s.id}, 'accepted')">Принять</button>
          <button class="btn btn-outline" onclick="updateSubmission(${s.id}, 'rejected')">Отклонить</button>
        </div>
      </div>
    </div>
  `).join("");
}

async function updateSubmission(id, status) {
  const views = parseInt(document.getElementById(`views-${id}`).value || "0");
  try {
    await api(`/api/admin/submissions/${id}/stats`, {
      method: "POST",
      body: JSON.stringify({ views, status }),
    });
    showToast("Статус обновлён");
    await loadSubmissionsAdmin();
  } catch (e) {
    showToast("Ошибка: " + e.message);
  }
}

async function loadWithdrawalsAdmin() {
  const list = await api("/api/admin/withdrawals");
  const box = document.getElementById("withdrawalsAdminList");
  if (!list.length) { box.innerHTML = `<div class="empty-state">Заявок пока нет</div>`; return; }
  box.innerHTML = list.map(w => `
    <div class="card">
      <div class="offer-row">
        <div>
          <div class="title">${w.amount.toFixed(2)} ₽</div>
          <div class="muted">${w.username ? "@" + w.username : w.user_tg_id}</div>
        </div>
        <span class="status-pill ${w.status === "approved" ? "status-accepted" : w.status === "rejected" ? "status-rejected" : "status-pending"}">${w.status}</span>
      </div>
      ${w.status === "pending" ? `
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button class="btn btn-accent" onclick="decideWithdrawal(${w.id}, 'approve')">Одобрить</button>
          <button class="btn btn-outline" onclick="decideWithdrawal(${w.id}, 'reject')">Отклонить</button>
        </div>` : ""}
    </div>
  `).join("");
}

async function decideWithdrawal(id, action) {
  try {
    await api(`/api/admin/withdrawals/${id}/${action}`, { method: "POST" });
    showToast("Готово");
    await loadWithdrawalsAdmin();
  } catch (e) {
    showToast("Ошибка: " + e.message);
  }
}

(async () => {
  const me = await api("/api/me").catch(() => null);
  if (!me || !me.is_admin) {
    document.querySelector(".container").innerHTML = `<div class="empty-state">Доступ только для администраторов</div>`;
    return;
  }
  await loadOffersAdmin();
})();
</script>
</body>
</html>
